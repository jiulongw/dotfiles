"$schema" = "https://starship.rs/config-schema.json"

format = """
[╭─](bright-black) $os$hostname$directory$git_branch$git_status$cmd_duration\
$line_break\
[╰─](bright-black)$character"""

palette = "catppuccin_mocha"

[os]
disabled = false
style = "bold white"
format = "[$symbol]($style)"

[os.symbols]
Ubuntu  = "󰕈 "
Artix   = "󰣇 "
Arch    = "󰣇 "
CachyOS = "󰣇 "
Macos   = " "

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold yellow"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold green"

[git_status]
format = "([$all_status$ahead_behind]($style)) "
style = "yellow"
modified = '!${count} '
untracked = '?${count} '
staged = '+${count} '
deleted = '-${count} '
renamed = '~${count} '
stashed = '*${count} '
conflicted = '=${count} '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇡${ahead_count}⇣${behind_count} '

[cmd_duration]
min_time = 2000
format = "[󰔛 $duration]($style) "
style = "yellow"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
